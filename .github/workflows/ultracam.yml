name: Build Ultra Cam Pro

on:
  push:
    paths:
      - '.github/workflows/ultracam.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Giai nen ma nguon
        run: echo "" | base64 -d | tar xz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: UltraCam
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UltraCam-apk
          path: UltraCam/app/build/outputs/apk/debug/*.apk
